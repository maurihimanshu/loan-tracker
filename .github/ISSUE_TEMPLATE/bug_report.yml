name: Bug Report
description: Report an issue, financial calculation error, or broken behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check if an existing issue covers your problem before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem encountered...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Enter loan amount '...' and rate '...'
        3. Add part-payment '...'
        4. See discrepancy
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually occurred?
      placeholder: |
        Expected: Baseline interest to show ₹...
        Actual: Baseline interest shows ₹...
    validations:
      required: true
  - type: textarea
    id: financial_details
    attributes:
      label: Loan Configuration Details (If Applicable)
      description: Principal, annual rate, tenure, first EMI date, broken-period interest mode, or part-payments involved.
      placeholder: |
        - Principal: ₹50,00,000
        - Interest Rate: 8.5%
        - Tenure: 240 months
        - Prepayment: ₹1,00,000 in month 2
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser version, operating system, or device.
      placeholder: "e.g., Chrome 130 on Windows 11, Safari on iOS 18"
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Self-Checklist
      options:
        - label: I have verified this is not an intentional behavior described in documentation.
          required: false
        - label: No private personally identifiable financial data is exposed in this report.
          required: true

