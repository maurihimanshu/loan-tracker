name: Feature Request
description: Suggest an idea, new repayment strategy, visualization, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new idea or enhancement for LoanTracker!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a problem or limitation? A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Enhancement
      description: A clear and concise description of what you want to happen or how the feature should behave.
      placeholder: "Describe the proposed feature, calculation, or UI flow..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
      placeholder: "I considered using..."
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context / Mockups
      description: Add any other context, references to banking calculation practices, or screenshots/mockups here.
    validations:
      required: false

